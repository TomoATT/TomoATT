version: 3

# Checkerboard (azimuthal anisotropy) — FORWARD run synthesizing travel times
# through checker_ani_coarse.h5 with the real merged src-rec geometry.

domain:
  min_max_dep: [-10, 200]
  min_max_lat: [24, 46]
  min_max_lon: [122, 148]
  n_rtp: [50, 111, 131]

source:
  src_rec_file: ../2_data_processing/src_rec_file_japan_tele.dat
  swap_src_rec: false

model:
  init_model_path: ../2_data_processing/checkerboard_models/checker_ani_coarse.h5
  model_1d_name: iasp91

parallel:
  n_sims: 1
  ndiv_rtp: [1, 1, 1]
  nproc_sub: 1
  use_gpu: false

output_setting:
  output_dir: ../OUTPUT_FILES_cb_forward_ani
  output_source_field: false
  output_kernel: false
  output_final_model: true
  output_in_process: true
  output_in_process_data: true
  single_precision_output: false
  verbose_output_level: 0
  output_file_format: 0

run_mode: 0

have_tele_data: true

ignore_velocity_discontinuity: True

calculation:
  convergence_tolerance: 1.0e-4
  max_iterations: 500
  stencil_order: 1
  stencil_type: 1
  sweep_type: 1
